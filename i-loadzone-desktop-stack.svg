<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="i-loadzone desktop utility layers for Windows and macOS">
  <defs>
    <linearGradient id="ghBg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <filter id="ghSh1" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.09" />
    </filter>
  </defs>

  <rect width="880" height="440" rx="14" fill="url(#ghBg1)" />
  <circle cx="775" cy="80" r="95" fill="#bae6fd" opacity="0.55" />
  <circle cx="95" cy="360" r="85" fill="#a7f3d0" opacity="0.5" />

  <g filter="url(#ghSh1)">
    <rect x="74" y="42" width="732" height="356" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  </g>

  <rect x="74" y="42" width="732" height="58" rx="12" fill="#0f766e" />
  <rect x="74" y="84" width="732" height="16" fill="#0f766e" />
  <rect x="102" y="57" width="128" height="28" rx="6" fill="#ffffff" />
  <text x="166" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">i-loadzone</text>
  <text x="248" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#f0fdfa">Organized Desktop Software Stack for Windows &amp; Mac</text>

  <!-- 3 Stacked Horizontal Layers -->
  <rect x="104" y="122" width="672" height="74" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
  <rect x="122" y="138" width="42" height="42" rx="8" fill="#0284c7" />
  <rect x="134" y="150" width="18" height="18" rx="3" fill="none" stroke="#ffffff" stroke-width="2.4" />
  <text x="182" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#111827">Core System &amp; File Utilities</text>
  <text x="182" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Archive managers, tabbed text editors, disk tree visualizers, and clipboard histories</text>
  <rect x="646" y="146" width="110" height="26" rx="13" fill="#e0f2fe" />
  <text x="701" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0369a1" text-anchor="middle">Daily Speed</text>

  <rect x="104" y="212" width="672" height="74" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" />
  <rect x="122" y="228" width="42" height="42" rx="8" fill="#0f766e" />
  <circle cx="143" cy="249" r="9" fill="none" stroke="#ffffff" stroke-width="2.4" />
  <text x="182" y="245" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#111827">Creative Media &amp; Document Tools</text>
  <text x="182" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Lightweight audio editors, PDF readers, batch format converters, and screen capture tools</text>
  <rect x="646" y="236" width="110" height="26" rx="13" fill="#ccfbf1" />
  <text x="701" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#0f766e" text-anchor="middle">Clean Output</text>

  <rect x="104" y="302" width="672" height="74" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.2" />
  <rect x="122" y="318" width="42" height="42" rx="8" fill="#059669" />
  <path d="M135 339 L141 345 L152 333" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <text x="182" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#134e4a">Hardware Drivers &amp; Troubleshooting Guides</text>
  <text x="182" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#115e59">Printer servicing notes, OS compatibility specs, and safe installation instructions</text>
  <rect x="646" y="326" width="110" height="26" rx="13" fill="#0f766e" />
  <text x="701" y="343" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">i-loadzone</text>
